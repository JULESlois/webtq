<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TGQQ Mobile Chat Fixture (<600px)</title>
<link rel="stylesheet" href="css/tweb.css">
<link rel="stylesheet" href="css/tgqq.css">
<link rel="stylesheet" href="css/fixture.css">
</head>
<script>if(location.search.includes('dark'))document.documentElement.classList.add('night');</script>
<body class="is-tgqq tq-dialog-skin tq-chat-header tq-chat-bubbles tq-chat-composer is-left-column-shown animation-level-2">

<div id="page-chats" class="page-chats">
  <div id="main-columns">
    <!-- ============ RIGHT: independent QQ-styled chat pane ============ -->
    <section id="column-center" class="main-column">
      <div class="chat tabs-tab active is-tgqq-chat" style="--chat-topbar-height:52px;--chat-input-height:264px">
        <div class="sidebar-header topbar has-avatar">
          <div class="chat-info">
            <button class="btn-icon sidebar-close-button"><span class="tgico tgico-left"></span></button>
            <div class="person-avatar">
              <div class="avatar" style="width:40px;height:40px;font-size:17px">林</div>
            </div>
            <div class="person">
              <div class="content">
                <div class="top">
                  <div class="user-title peer-title">林晚晴</div>
                </div>
                <div class="bottom">
                  <span class="online">在线</span>
                </div>
              </div>
            </div>
          </div>
          <div class="chat-utils">
            <button class="btn-icon" title="语音通话"><span class="tgico tgico-phone"></span></button>
            <button class="btn-icon" title="视频通话"><span class="tgico tgico-videochat"></span></button>
            <button class="btn-icon btn-menu-toggle" title="更多"><span class="tgico tgico-more"></span></button>
          </div>
        </div>

        <div class="bubbles-viewport">
          <div class="bubbles">
            <div class="bubbles-inner">
              <div class="bubbles-date-group">
                <div class="bubble is-date">
                  <div class="bubble-content">今天 14:12</div>
                </div>
              </div>
              <div class="bubbles-group">
                <div class="bubble is-in is-group-first is-group-last">
                  <div class="bubble-content">
                    <div class="message"><span class="text-content">嗨，周末有空吗？</span></div>
                    <span class="time">14:12</span>
                  </div>
                </div>
                <div class="bubble is-in is-group-first is-group-last">
                  <div class="bubble-content">
                    <div class="message"><span class="text-content">听说郊区的枫叶红了，想约你一起去看看 🍁</span></div>
                    <span class="time">14:13</span>
                  </div>
                </div>
                <div class="bubble is-out is-group-first is-group-last">
                  <div class="bubble-content">
                    <div class="message"><span class="text-content">好啊！我也正想出门走走</span></div>
                    <span class="time">14:15<span class="message-status">✓✓</span></span>
                  </div>
                </div>
                <div class="bubble is-out is-group-first is-group-last">
                  <div class="bubble-content">
                    <div class="message"><span class="text-content">那就周六早上九点老地方集合？</span></div>
                    <span class="time">14:16<span class="message-status">✓✓</span></span>
                  </div>
                </div>
                <div class="bubble is-in is-group-first is-group-last">
                  <div class="bubble-content">
                    <div class="reply">
                      <span class="reply-title">林晚晴</span>
                      <span class="reply-subtitle">那就周六早上九点老地方集合？</span>
                    </div>
                    <div class="message"><span class="text-content">没问题，顺便带点零食上去</span></div>
                    <span class="time">14:18</span>
                  </div>
                </div>
                <div class="bubble is-out is-group-first is-group-last">
                  <div class="bubble-content">
                    <div class="message"><span class="text-content">好嘞，周六见！</span></div>
                    <span class="time">14:23<span class="message-status">✓✓</span></span>
                  </div>
                </div>
                <div class="bubble is-out is-group-first is-group-last">
                  <div class="bubble-content">
                    <div class="message"><span class="text-content">行，我开车过去，顺路接你</span></div>
                    <span class="time">14:25<span class="message-status">✓✓</span></span>
                  </div>
                </div>
                <div class="bubble is-out is-group-first is-group-last">
                  <div class="bubble-content">
                    <div class="message"><span class="text-content">带件外套，山上风大</span></div>
                    <span class="time">14:25<span class="message-status">✓✓</span></span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="chat-input" style="margin-top:auto">
          <div class="chat-input-container">
            <div class="rows-wrapper-wrapper">
              <div class="rows-wrapper chat-input-control chat-input-wrapper chat-rows-wrapper">
                <div class="new-message-wrapper rows-wrapper-row">
                <button class="btn-icon tq-quick-btn tq-quick-voice"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#666666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a4 4 0 0 0-4 4v5a4 4 0 0 0 8 0V7a4 4 0 0 0-4-4Z"/><path d="M5 11v1a7 7 0 0 0 14 0v-1"/><path d="M12 19v2"/></svg></button>
                <button class="btn-icon tq-quick-btn tq-quick-gallery"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#666666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="m5 19 5.5-5.5 3.5 3.5 3-3L21 19"/></svg></button>
                <button class="btn-icon tq-quick-btn tq-quick-camera"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#666666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1Z"/><circle cx="12" cy="14" r="3.5"/></svg></button>
                <button class="btn-icon tq-quick-btn tq-quick-file"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#666666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8Z"/><path d="M14 3v5h5"/></svg></button>
                <button class="btn-icon chat-input-control-button toggle-emoticons"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#666666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M8.8 10h.01M15.2 10h.01"/><path d="M8.8 13.6a3.8 3.8 0 0 0 6.4 0"/></svg></button>
                <div class="input-message-container">
                  <div class="input-message-input" data-inline-placeholder="发送消息"></div>
                </div>
                <button class="btn-icon chat-input-control-button attach-file"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#666666" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
                <div class="btn-send-container">
                  <button class="btn-icon btn-primary text-bold chat-input-control-button btn-send"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg></button>
                </div>

                <!-- QQ9 4-grid attach panel (inline under the toolbar; real DOM is .btn-menu.tq-attach-menu) -->
                <div class="btn-menu top-right tq-attach-menu tq-attach-menu-inline active">
                  <div class="btn-menu-item"><div class="btn-menu-item-icon"><svg viewBox="0 0 24 24" fill="#3A3A3A"><path d="M12 2.5c-3.6 0-6.5 2.9-6.5 6.5 0 4.9 5.4 11.3 6 12 .2.3.8.3 1 0 .6-.7 6-7.1 6-12 0-3.6-2.9-6.5-6.5-6.5Zm0 9a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5Z"/></svg></div><div class="btn-menu-item-text">位置</div></div>
                  <div class="btn-menu-item"><div class="btn-menu-item-icon"><svg viewBox="0 0 24 24" fill="#3A3A3A"><path d="M6 2.5h8l4.5 4.5V21a.5.5 0 0 1-.5.5h-12a.5.5 0 0 1-.5-.5V3a.5.5 0 0 1 .5-.5ZM14 3v4h4l-4-4ZM8 11h8v1.5H8V11Zm0 3.5h8V16H8v-1.5Zm0 3.5h5V19H8v-1.5Z"/></svg></div><div class="btn-menu-item-text">文件</div></div>
                  <div class="btn-menu-item"><div class="btn-menu-item-icon"><svg viewBox="0 0 24 24" fill="#3A3A3A"><path d="m12 3 2.4 5 5.6.7-4.1 3.9 1 5.4-4.9-2.7-4.9 2.7 1-5.4L4 8.7l5.6-.7L12 3Z"/></svg></div><div class="btn-menu-item-text">收藏</div></div>
                  <div class="btn-menu-item"><div class="btn-menu-item-icon"><svg viewBox="0 0 24 24" fill="#3A3A3A"><path d="M8.2 11.5c.6 0 1.1-.2 1.5-.6.1-.1.1-.3 0-.4-.4-.5-.6-1.1-.6-1.7 0-.6.2-1.1.6-1.6.1-.1.1-.3 0-.4-.4-.4-1-.7-1.5-.7-1.4 0-2.5 1.5-2.5 2.7 0 1.2 1.1 2.7 2.5 2.7Zm7.6 0c1.4 0 2.5-1.5 2.5-2.7 0-1.2-1.1-2.7-2.5-2.7-.5 0-1.1.3-1.5.7-.1.1-.1.3 0 .4.4.5.6 1 .6 1.6 0 .6-.2 1.2-.6 1.7-.1.1-.1.3 0 .4.4.4.9.6 1.5.6Zm1.2 1.3c-1.1.2-2.1 1-2.5 2-.4-1-1.4-1.8-2.5-1.8s-2.1.8-2.5 1.8c-.4-1-1.4-2-2.5-2-.9 0-1.7.4-2.2 1.1l.9 1.2c.6-.5 2.9-.5 3.3.7 0 .2.1.4.3.4h1c.2 0 .3-.2.3-.4.4-1.2 2.7-1.2 3.3-.7l.9-1.2c-.5-.7-1.3-1.1-2.2-1.1Z"/></svg></div><div class="btn-menu-item-text">戳一戳</div></div>
                </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- ============ RIGHT sidebar (unused in mobile chat) ============ -->
    <aside id="column-right" class="main-column"></aside>
  </div>
</div>

</body>
</html>
