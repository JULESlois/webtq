<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TGQQ Mobile Chat Fixture (<600px)</title>
<link rel="stylesheet" href="css/tweb.css">
<link rel="stylesheet" href="css/tgqq.css">
<link rel="stylesheet" href="css/fixture.css">
</head>
<script>if(location.search.includes('dark'))document.documentElement.classList.add('night');</script>
<body class="is-tgqq tq-dialog-skin tq-chat-header tq-chat-bubbles tq-chat-composer is-left-column-shown animation-level-2">

<div id="page-chats" class="page-chats">
  <div id="main-columns">
    <!-- ============ RIGHT: independent QQ-styled chat pane ============ -->
    <section id="column-center" class="main-column">
      <div class="chat tabs-tab active is-tgqq-chat" style="--chat-topbar-height:52px">
        <div class="sidebar-header topbar has-avatar">
          <div class="chat-info">
            <button class="btn-icon sidebar-close-button"><span class="tgico tgico-left"></span></button>
            <div class="person-avatar">
              <div class="avatar" style="width:40px;height:40px;font-size:17px">林</div>
            </div>
            <div class="person">
              <div class="content">
                <div class="top">
                  <div class="user-title peer-title">林晚晴</div>
                </div>
                <div class="bottom">
                  <span class="online">在线</span>
                </div>
              </div>
            </div>
          </div>
          <div class="chat-utils">
            <button class="btn-icon" title="语音通话"><span class="tgico tgico-phone"></span></button>
            <button class="btn-icon" title="视频通话"><span class="tgico tgico-videochat"></span></button>
            <button class="btn-icon btn-menu-toggle" title="更多"><span class="tgico tgico-more"></span></button>
          </div>
        </div>

        <div class="bubbles-viewport">
          <div class="bubbles">
            <div class="bubbles-inner">
              <div class="bubbles-date-group">
                <div class="bubble is-date">
                  <div class="bubble-content">今天 14:12</div>
                </div>
              </div>
              <div class="bubbles-group">
                <div class="bubble is-in is-group-first is-group-last">
                  <div class="bubble-content">
                    <div class="message"><span class="text-content">嗨，周末有空吗？</span></div>
                    <span class="time">14:12</span>
                  </div>
                </div>
                <div class="bubble is-in is-group-first is-group-last">
                  <div class="bubble-content">
                    <div class="message"><span class="text-content">听说郊区的枫叶红了，想约你一起去看看 🍁</span></div>
                    <span class="time">14:13</span>
                  </div>
                </div>
                <div class="bubble is-out is-group-first is-group-last">
                  <div class="bubble-content">
                    <div class="message"><span class="text-content">好啊！我也正想出门走走</span></div>
                    <span class="time">14:15<span class="message-status">✓✓</span></span>
                  </div>
                </div>
                <div class="bubble is-out is-group-first is-group-last">
                  <div class="bubble-content">
                    <div class="message"><span class="text-content">那就周六早上九点老地方集合？</span></div>
                    <span class="time">14:16<span class="message-status">✓✓</span></span>
                  </div>
                </div>
                <div class="bubble is-in is-group-first is-group-last">
                  <div class="bubble-content">
                    <div class="reply">
                      <span class="reply-title">林晚晴</span>
                      <span class="reply-subtitle">那就周六早上九点老地方集合？</span>
                    </div>
                    <div class="message"><span class="text-content">没问题，顺便带点零食上去</span></div>
                    <span class="time">14:18</span>
                  </div>
                </div>
                <div class="bubble is-out is-group-first is-group-last">
                  <div class="bubble-content">
                    <div class="message"><span class="text-content">好嘞，周六见！</span></div>
                    <span class="time">14:23<span class="message-status">✓✓</span></span>
                  </div>
                </div>
                <div class="bubble is-out is-group-first is-group-last">
                  <div class="bubble-content">
                    <div class="message"><span class="text-content">行，我开车过去，顺路接你</span></div>
                    <span class="time">14:25<span class="message-status">✓✓</span></span>
                  </div>
                </div>
                <div class="bubble is-out is-group-first is-group-last">
                  <div class="bubble-content">
                    <div class="message"><span class="text-content">带件外套，山上风大</span></div>
                    <span class="time">14:25<span class="message-status">✓✓</span></span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="chat-input">
          <div class="chat-input-container">
            <div class="rows-wrapper-wrapper">
              <div class="rows-wrapper chat-input-control chat-input-wrapper chat-rows-wrapper">
                <button class="btn-icon chat-input-control-button toggle-emoticons"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" fill="#FFD54F"/><circle cx="8.5" cy="9.5" r="1.4" fill="#5D4037"/><circle cx="15.5" cy="9.5" r="1.4" fill="#5D4037"/><path d="M8 14c1.2 1.6 2.6 2.4 4 2.4s2.8-.8 4-2.4" stroke="#5D4037" stroke-width="1.6" stroke-linecap="round"/></svg></button>
                <div class="input-message-container">
                  <div class="input-message-input" data-inline-placeholder="发送消息"></div>
                </div>
                <button class="btn-icon chat-input-control-button attach-file"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#5A5A5A" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
                <button class="btn-icon btn-primary text-bold chat-input-control-button btn-send"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg></button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- ============ RIGHT sidebar (unused in mobile chat) ============ -->
    <aside id="column-right" class="main-column"></aside>
  </div>
</div>

    <!-- QQ9 attach bottom sheet (static fixture; real DOM is .btn-menu.tq-attach-menu in overlay root) -->
    <div class="btn-menu top-right tq-attach-menu active">
            <div class="btn-menu-item"><div class="btn-menu-item-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M3 17l5-5 4 4 3-3 6 6"/></svg></div><div class="btn-menu-item-text">相册</div></div>
      <div class="btn-menu-item"><div class="btn-menu-item-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.2"/></svg></div><div class="btn-menu-item-text">拍摄</div></div>
      <div class="btn-menu-item"><div class="btn-menu-item-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/><path d="M9 12h6M9 16h6"/></svg></div><div class="btn-menu-item-text">文件</div></div>
      <div class="btn-menu-item"><div class="btn-menu-item-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-5.5 7-11a7 7 0 1 0-14 0c0 5.5 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg></div><div class="btn-menu-item-text">位置</div></div>
      <div class="btn-menu-item"><div class="btn-menu-item-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="14" rx="3"/><path d="M3 10h18M12 6v14"/><path d="M9 12l3 3 3-3"/></svg></div><div class="btn-menu-item-text">红包</div></div>
      <div class="btn-menu-item"><div class="btn-menu-item-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h13l-3-3M20 15H7l3 3"/></svg></div><div class="btn-menu-item-text">转账</div></div>
      <div class="btn-menu-item"><div class="btn-menu-item-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a12 12 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg></div><div class="btn-menu-item-text">语音通话</div></div>
      <div class="btn-menu-item"><div class="btn-menu-item-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="13" height="12" rx="3"/><path d="M16 10l5-3v10l-5-3"/></svg></div><div class="btn-menu-item-text">视频通话</div></div>
    </div>

</body>
</html>
