<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TGQQ Mobile Chat Fixture (<600px)</title>
<link rel="stylesheet" href="css/tweb.css">
<link rel="stylesheet" href="css/tgqq.css">
<link rel="stylesheet" href="css/fixture.css">
</head>
<script>if(location.search.includes('dark'))document.documentElement.classList.add('night');</script>
<body class="is-tgqq tq-dialog-skin tq-chat-header tq-chat-bubbles tq-chat-composer is-left-column-shown animation-level-2">

<div id="page-chats" class="page-chats">
  <div id="main-columns">
    <!-- ============ RIGHT: independent QQ-styled chat pane ============ -->
    <section id="column-center" class="main-column">
      <div class="chat tabs-tab active is-tgqq-chat" style="--chat-topbar-height:52px">
    <!-- QQ9 emoji bottom sheet (static fixture mirroring tweb .emoji-dropdown) -->
    <div class="emoji-dropdown active" style="display:flex">
      <div class="emoji-container">
        <div class="tabs-container">
          <div class="tabs-tab emoticons-container active">
            <div class="emoticons-categories-container">
              <div class="menu-wrapper emoticons-menu-wrapper">
                <div class="menu-horizontal-div no-stripe justify-start emoticons-menu"><span class="menu-horizontal-div-item active">😀</span><span class="menu-horizontal-div-item">😊</span><span class="menu-horizontal-div-item">🐶</span><span class="menu-horizontal-div-item">🍔</span><span class="menu-horizontal-div-item">⚽</span><span class="menu-horizontal-div-item">🚗</span><span class="menu-horizontal-div-item">💡</span><span class="menu-horizontal-div-item">❤</span><span class="menu-horizontal-div-item">️</span></div>
              </div>
            </div>
            <div class="emoticons-content"><div class="emoticons-category"><div class="emoticons-category-title">最近使用</div><div class="super-emojis"><span class="super-emoji">😀</span><span class="super-emoji">😁</span><span class="super-emoji">😂</span><span class="super-emoji">🤣</span><span class="super-emoji">😊</span><span class="super-emoji">😍</span><span class="super-emoji">😘</span><span class="super-emoji">😜</span><span class="super-emoji">🤪</span><span class="super-emoji">😎</span><span class="super-emoji">🥳</span><span class="super-emoji">😅</span><span class="super-emoji">😉</span><span class="super-emoji">🙃</span><span class="super-emoji">😋</span><span class="super-emoji">🤗</span><span class="super-emoji">😏</span><span class="super-emoji">😒</span><span class="super-emoji">😌</span><span class="super-emoji">😔</span></div></div><div class="emoticons-category"><div class="emoticons-category-title">笑脸</div><div class="super-emojis"><span class="super-emoji">😀</span><span class="super-emoji">😃</span><span class="super-emoji">😄</span><span class="super-emoji">😁</span><span class="super-emoji">😆</span><span class="super-emoji">😅</span><span class="super-emoji">🤣</span><span class="super-emoji">😂</span><span class="super-emoji">🙂</span><span class="super-emoji">🙃</span><span class="super-emoji">😉</span><span class="super-emoji">😊</span><span class="super-emoji">😇</span><span class="super-emoji">🥰</span><span class="super-emoji">😍</span><span class="super-emoji">🤩</span><span class="super-emoji">😘</span><span class="super-emoji">😗</span><span class="super-emoji">😚</span><span class="super-emoji">😙</span><span class="super-emoji">😋</span><span class="super-emoji">😛</span><span class="super-emoji">😜</span><span class="super-emoji">🤪</span></div></div><div class="emoticons-category"><div class="emoticons-category-title">动物</div><div class="super-emojis"><span class="super-emoji">🐶</span><span class="super-emoji">🐱</span><span class="super-emoji">🐭</span><span class="super-emoji">🐹</span><span class="super-emoji">🐰</span><span class="super-emoji">🦊</span><span class="super-emoji">🐻</span><span class="super-emoji">🐼</span><span class="super-emoji">🐨</span><span class="super-emoji">🐯</span><span class="super-emoji">🦁</span><span class="super-emoji">🐮</span><span class="super-emoji">🐷</span><span class="super-emoji">🐸</span><span class="super-emoji">🐵</span><span class="super-emoji">🙈</span><span class="super-emoji">🙉</span><span class="super-emoji">🙊</span><span class="super-emoji">🐔</span><span class="super-emoji">🐧</span><span class="super-emoji">🐦</span><span class="super-emoji">🐤</span><span class="super-emoji">🦆</span><span class="super-emoji">🦅</span></div></div></div>
          </div>
        </div>
      </div>
      <div class="emoji-tabs menu-horizontal-div emoticons-menu no-stripe"><button class="btn-icon emoji-tabs-search"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button><button class="btn-icon menu-horizontal-div-item emoji-tabs-emoji active"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.5s1.2 2 3.5 2 3.5-2 3.5-2"/><circle cx="9" cy="10" r="1"/><circle cx="15" cy="10" r="1"/></svg></button><button class="btn-icon menu-horizontal-div-item emoji-tabs-stickers"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8z"/><path d="M14 3v6h6"/><circle cx="9.5" cy="12.5" r="1"/><circle cx="14.5" cy="12.5" r="1"/><path d="M9.5 16.5c2 .8 4 .8 6 0"/></svg></button><button class="btn-icon menu-horizontal-div-item emoji-tabs-gifs"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M7 12h4M9 10v4M13 10v4h2a1.5 1.5 0 0 0 0-3h-2"/></svg></button><button class="btn-icon emoji-tabs-delete"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 6H5l1.5 14h11z"/><path d="M9 10v6M15 10v6M8 6l1-3h6l1 3"/></svg></button></div>
    </div>

        <div class="sidebar-header topbar has-avatar">
          <div class="chat-info">
            <button class="btn-icon sidebar-close-button"><span class="tgico tgico-left"></span></button>
            <div class="person-avatar">
              <div class="avatar" style="width:40px;height:40px;font-size:17px">林</div>
            </div>
            <div class="person">
              <div class="content">
                <div class="top">
                  <div class="user-title peer-title">林晚晴</div>
                </div>
                <div class="bottom">
                  <span class="online">在线</span>
                </div>
              </div>
            </div>
          </div>
          <div class="chat-utils">
            <button class="btn-icon" title="语音通话"><span class="tgico tgico-phone"></span></button>
            <button class="btn-icon" title="视频通话"><span class="tgico tgico-videochat"></span></button>
            <button class="btn-icon btn-menu-toggle" title="更多"><span class="tgico tgico-more"></span></button>
          </div>
        </div>

        <div class="bubbles-viewport">
          <div class="bubbles">
            <div class="bubbles-inner">
              <div class="bubbles-date-group">
                <div class="bubble is-date">
                  <div class="bubble-content">今天 14:12</div>
                </div>
              </div>
              <div class="bubbles-group">
                <div class="bubbles-group-avatar-container">
                  <div class="bubbles-group-avatar user-avatar">
                    <div class="avatar" style="width:40px;height:40px;font-size:17px">林</div>
                  </div>
                </div>
                <div class="bubble is-in is-group-first">
                  <div class="bubble-content-wrapper">
                    <div class="bubble-content">
                      <div class="message"><span class="text-content">嗨，周末有空吗？</span></div>
                      <span class="time">14:12</span>
                    </div>
                  </div>
                </div>
                <div class="bubble is-in is-group-last">
                  <div class="bubble-content-wrapper">
                    <div class="bubble-content">
                      <div class="message"><span class="text-content">听说郊区的枫叶红了，想约你一起去看看 🍁</span></div>
                      <span class="time">14:13</span>
                    </div>
                  </div>
                </div>
              </div>
              <div class="bubbles-group">
                <div class="bubble is-out is-group-first is-group-last is-read">
                  <div class="bubble-content-wrapper">
                    <div class="bubble-content">
                      <div class="message"><span class="text-content">好啊！我也正想出门走走</span></div>
                      <span class="time">14:15<span class="tgico tgico-checks time-sending-status"></span></span>
                    </div>
                  </div>
                </div>
              </div>
              <div class="bubbles-group">
                <div class="bubble is-out is-group-first is-group-last is-sent">
                  <div class="bubble-content-wrapper">
                    <div class="bubble-content">
                      <div class="message"><span class="text-content">那就周六早上九点老地方集合？</span></div>
                      <span class="time">14:16<span class="tgico tgico-check time-sending-status"></span></span>
                    </div>
                  </div>
                </div>
              </div>
              <div class="bubbles-group">
                <div class="bubbles-group-avatar-container">
                  <div class="bubbles-group-avatar user-avatar">
                    <div class="avatar" style="width:40px;height:40px;font-size:17px">林</div>
                  </div>
                </div>
                <div class="bubble is-in is-group-first is-group-last">
                  <div class="bubble-content-wrapper">
                    <div class="bubble-content">
                      <div class="reply">
                        <span class="reply-title">林晚晴</span>
                        <span class="reply-subtitle">那就周六早上九点老地方集合？</span>
                      </div>
                      <div class="message"><span class="text-content">没问题，顺便带点零食上去</span></div>
                      <span class="time">14:18</span>
                    </div>
                  </div>
                </div>
              </div>
              <div class="bubbles-group">
                <div class="bubble is-out is-group-first is-group-last is-read">
                  <div class="bubble-content-wrapper">
                    <div class="bubble-content">
                      <div class="message"><span class="text-content">好嘞，周六见！</span></div>
                      <span class="time">14:23<span class="tgico tgico-checks time-sending-status"></span></span>
                    </div>
                  </div>
                </div>
              </div>
              <div class="bubbles-group">
                <div class="bubble is-out is-group-first is-group-last is-sent">
                  <div class="bubble-content-wrapper">
                    <div class="bubble-content">
                      <div class="message"><span class="text-content">行，我开车过去，顺路接你</span></div>
                      <span class="time">14:25<span class="tgico tgico-check time-sending-status"></span></span>
                    </div>
                  </div>
                </div>
              </div>
              <div class="bubbles-group">
                <div class="bubble is-out is-group-first is-group-last is-read">
                  <div class="bubble-content-wrapper">
                    <div class="bubble-content">
                      <div class="message"><span class="text-content">带件外套，山上风大</span></div>
                      <span class="time">14:25<span class="tgico tgico-checks time-sending-status"></span></span>
                    </div>
                  </div>
                </div>
              </div>
        <div class="chat-input">
          <div class="chat-input-container">
            <div class="rows-wrapper-wrapper">
              <div class="rows-wrapper chat-input-control chat-input-wrapper chat-rows-wrapper">
                <button class="btn-icon chat-input-control-button toggle-emoticons"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" fill="#FFD54F"/><circle cx="8.5" cy="9.5" r="1.4" fill="#5D4037"/><circle cx="15.5" cy="9.5" r="1.4" fill="#5D4037"/><path d="M8 14c1.2 1.6 2.6 2.4 4 2.4s2.8-.8 4-2.4" stroke="#5D4037" stroke-width="1.6" stroke-linecap="round"/></svg></button>
                <div class="input-message-container">
                  <div class="input-message-input" data-inline-placeholder="发送消息"></div>
                </div>
                <button class="btn-icon chat-input-control-button attach-file"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#5A5A5A" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
                <button class="btn-icon btn-primary text-bold chat-input-control-button btn-send"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg></button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- ============ RIGHT sidebar (unused in mobile chat) ============ -->
    <aside id="column-right" class="main-column"></aside>
  </div>
</div>

</body>
</html>
