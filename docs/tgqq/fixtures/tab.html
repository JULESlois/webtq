function contactSection(title, rows) {

  </div></section>`;
}

function postCard(name, time, gradient, text, images, likes, comments, forwards, imgStart = 0) {
  const cells = [];
  for(let i = 0; i < images; i++) {
    const src = `imgs/photo${String(((i + imgStart) % 12) + 1).padStart(2, '0')}.jpg`;
    cells.push(`<img class="tq-img" src="${src}" alt="" loading="lazy">`);
  }
  const grid = images === 0 ? '' : images === 1 ? `<div class="tq-img-single">${cells.join('')}</div>` : `<div class="tq-img-grid">${cells.join('')}</div>`;
  return `<article class="tq-post"><div class="tq-post-head"><div class="tq-row-avatar tq-round tq-post-avatar" style="background:${gradient}">${name.slice(0,1)}</div><div class="tq-post-meta"><div class="tq-post-name">${name}</div><div class="tq-post-time">${time}</div></div></div><div class="tq-post-text">${text}</div>${grid}<div class="tq-post-actions"><button><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.6-9.2-8.6C1.2 8.6 3 5.5 6.2 5.5c2 0 3.3 1.1 4.2 2.4l1.6 2.1 1.6-2.1c.9-1.3 2.2-2.4 4.2-2.4 3.2 0 5 3.1 3.2 5.9C19 15.4 12 20 12 20z"/></svg>${likes}</button><button><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-8.5 8.4 8.9 8.9 0 0 1-3.4-.7L3 20.5l1.3-4.1a8 8 0 0 1-.8-3.4A8.4 8.4 0 0 1 12 4.5a8.4 8.4 0 0 1 9 7z"/></svg>${comments}</button><button><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="M16 6l-4-4-4 4"/><path d="M12 2v13"/></svg>${forwards}</button></div></article>`;
}

if(new URLSearchParams(location.search).get('mobile')) {
  document.body.classList.remove('tq-tablet');
}
document.getElementById('tq-pages').innerHTML = PAGES[TAB] || PAGES.channels;

function recommendRows(rows) {
  return rows.map(r => `<div class="tq-row"><div class="tq-avatar-wrap"><div class="tq-row-avatar tq-round" style="background:${r[2]}">${r[0].slice(0,1)}</div></div><div class="tq-row-meta"><div class="tq-row-name">${r[0]}</div><div class="tq-row-desc">${r[1]}</div></div><button class="tq-add-btn">添加</button></div>`).join('');
}

function deviceRows(rows) {
  return rows.map(r => `<div class="tq-row"><span class="tq-device-icon">${r[3]}</span><div class="tq-row-meta"><div class="tq-row-name">${r[0]}</div><div class="tq-row-desc">${r[1]}</div></div><span class="tq-row-arrow">›</span></div>`).join('');
}

// Contacts page: optional ctab=recommend|device view
if(TAB === 'contacts') {
  const ctab = new URLSearchParams(location.search).get('ctab');
  if(ctab === 'recommend' || ctab === 'device') {
    const content = document.getElementById('tq-contacts-content');
    const tabs = document.querySelectorAll('#tq-contacts-tabs .tq-tab');
    tabs.forEach(t => t.classList.toggle('tq-tab-active', t.dataset.tqTab === ctab));
    document.querySelector('.tq-contacts .tq-index')?.remove();
    content.innerHTML = ctab === 'recommend'
      ? `<section class="tq-section"><div class="tq-section-label">推荐联系人</div><div class="tq-list">
          ${recommendRows([
            ['顾南星','共同好友 3 人 · 喜欢摄影','linear-gradient(135deg,#12b7f5,#1296db)'],
            ['许一诺','通讯录好友 · 来自手机通讯录','linear-gradient(135deg,#ff9a56,#ff6a3d)'],
            ['陆之遥','共同群聊：前端交流群','linear-gradient(135deg,#9b59b6,#8e44ad)']
          ])}
        </div></section>`
      : `<section class="tq-section"><div class="tq-section-label">我的设备</div><div class="tq-list">
          ${deviceRows([
            ['我的手机','当前设备 · 在线','','<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2.5" width="10" height="19" rx="2.2"/><path d="M10.8 18.5h2.4"/></svg>'],

            ['我的平板','上次登录：上周','','<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="3.5" width="15" height="17" rx="2"/><path d="M10.5 18h3"/></svg>']
          ])}
        </div></section>`;
  }
}

// Channel page: 推荐/关注 tab strip
if(TAB === 'channels') {
  const qs = new URLSearchParams(location.search);
  const tabs = document.querySelectorAll('.tq-tab');
  const panels = document.querySelectorAll('.tq-tab-panel');
  const switchTab = (name) => {
    tabs.forEach(t => t.classList.toggle('tq-tab-active', t.dataset.tqTab === name));
    panels.forEach(p => { p.hidden = p.dataset.tqPanel !== name; });
  };
  tabs.forEach(t => t.addEventListener('click', () => switchTab(t.dataset.tqTab)));
  document.querySelectorAll('.tq-follow').forEach(btn => {
    btn.addEventListener('click', () => btn.classList.toggle('tq-follow-active'));
  });
  if(qs.get('follow') === '1') {
    document.querySelector('.tq-follow-empty').hidden = true;
    document.querySelector('.tq-follow-list').hidden = false;
    switchTab('follow');
  } else {
    switchTab('recommend');
  }
}
document.querySelectorAll('nav button').forEach(b => {
  b.classList.toggle('_itemSelected_rma6i_36', b.dataset.tab === TAB);
  if(b.dataset.tab === 'dynamics') {
    const dot = document.createElement('i');
    dot.className = 'tq-nav-dot';
    b.appendChild(dot);
  }
});
if(TAB === 'contacts') document.body.classList.add('tq-contacts-page');
document.querySelectorAll('.tq-follow').forEach(btn => {
  btn.addEventListener('click', () => {
    const active = btn.classList.toggle('tq-follow-active');
    btn.textContent = active ? '已关注' : '+ 关注';
  });
});
document.querySelectorAll('.tq-post-actions button').forEach(btn => {
  btn.addEventListener('click', () => {
    const active = btn.classList.toggle('tq-action-active');
    if(active && btn.firstElementChild) {
      const n = parseInt(btn.textContent.replace(/[^0-9]/g, ''), 10) || 0;
      btn.childNodes[btn.childNodes.length - 1].textContent = ' ' + (n + 1);
    }
  });
});
</script>
