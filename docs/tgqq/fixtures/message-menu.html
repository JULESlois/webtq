<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TGQQ Group Chat Fixture</title>
<link rel="stylesheet" href="css/tweb.css">
<link rel="stylesheet" href="css/tgqq.css">
<link rel="stylesheet" href="css/fixture.css">
</head>
<script>if(location.search.includes('dark'))document.documentElement.classList.add('night');</script>
<body class="is-tgqq tq-dialog-skin tq-chat-header tq-chat-bubbles tq-chat-composer is-left-column-shown animation-level-2">

<div id="page-chats" class="page-chats">
  <div id="main-columns">
    <!-- ============ RIGHT: independent QQ-styled chat pane ============ -->
    <section id="column-center" class="main-column">
      <div class="chat tabs-tab active is-tgqq-chat is-tgqq-group" style="--chat-topbar-height:52px">
        <div class="sidebar-header topbar has-avatar">
          <div class="chat-info">
            <button class="btn-icon sidebar-close-button"><span class="tgico tgico-left"></span></button>
            <div class="person-avatar">
              <div class="avatar" style="width:40px;height:40px;font-size:17px">产</div>
            </div>
            <div class="person">
              <div class="content">
                <div class="top">
                  <div class="user-title peer-title">产品讨论组</div>
                </div>
                <div class="bottom">
                  <span class="group-members">128 人</span>
                </div>
              </div>
            </div>
          </div>
          <div class="chat-utils">
            <button class="btn-icon" title="语音通话"><span class="tgico tgico-phone"></span></button>
            <button class="btn-icon" title="视频通话"><span class="tgico tgico-videochat"></span></button>
            <button class="btn-icon btn-menu-toggle" title="更多"><span class="tgico tgico-more"></span></button>
          </div>
        </div>

                <div class="bubbles-viewport">
          <div class="bubbles">
            <div class="bubbles-inner is-chat">
              <div class="bubbles-date-group">
                <div class="bubble is-date">
                  <div class="bubble-content">今天 14:12</div>
                </div>
              </div>
              <div class="bubbles-group">
                <div class="bubbles-group-avatar-container">
                  <div class="bubbles-group-avatar user-avatar">
                    <div class="avatar" style="width:40px;height:40px;font-size:17px">陈</div>
                  </div>
                </div>
                <div class="bubble is-in is-group-first">
                  <div class="bubble-content-wrapper">
<div class="bubble-content">
                    <div class="name">陈默</div>
                    <div class="message"><span class="text-content">新版原型我已经传到群里了，大家先看看</span></div>
                    <span class="time">14:12</span>
                  </div></div>

                </div>
                <div class="bubble is-in">
                  <div class="bubble-content-wrapper">
<div class="bubble-content">
                    <div class="message"><span class="text-content">首页的布局我按 QQ9 的样式重排了一版</span></div>
                    <span class="time">14:12</span>
                  </div></div>

                </div>
                <div class="bubble is-in is-group-last">
                  <div class="bubble-content-wrapper">
<div class="bubble-content">
                    <div class="message"><span class="text-content">大家重点看交互流程那里</span></div>
                    <span class="time">14:13</span>
                  </div></div>

                </div>
              </div>
              <div class="bubbles-group">
                <div class="bubbles-group-avatar-container">
                  <div class="bubbles-group-avatar user-avatar tq-own">
                    <div class="avatar" style="width:40px;height:40px;font-size:17px">我</div>
                  </div>
                </div>
                <div class="bubble is-out is-group-first">
                  <div class="bubble-content-wrapper">
<div class="bubble-content">
                    <div class="message"><span class="text-content">收到，我下午看完给你反馈</span></div>
                    <span class="time">14:15<span class="message-status">✓✓</span></span>
                  </div></div>

                </div>
                <div class="bubble is-out is-group-last">
                  <div class="bubble-content-wrapper">
<div class="bubble-content">
                    <div class="message"><span class="text-content">顺便把顶栏那三个图标也换掉了</span></div>
                    <span class="time">14:16<span class="message-status">✓✓</span></span>
                  </div></div>

                </div>
              </div>
              <div class="bubbles-group">
                <div class="bubbles-group-avatar-container">
                  <div class="bubbles-group-avatar user-avatar">
                    <div class="avatar" style="width:40px;height:40px;font-size:17px">周</div>
                  </div>
                </div>
                <div class="bubble is-in is-group-first is-group-last">
                  <div class="bubble-content-wrapper">
<div class="bubble-content">
                    <div class="reply">
                      <span class="reply-title">我</span>
                      <span class="reply-subtitle">顺便把顶栏那三个图标也换掉了</span>
                    </div>
                    <div class="name">周子昂</div>
                    <div class="message"><span class="text-content">看到了，挺 QQ 的 👍</span></div>
                    <span class="time">14:18</span>
                  </div></div>

                </div>
              </div>
              <div class="bubbles-group">
                <div class="bubbles-group-avatar-container">
                  <div class="bubbles-group-avatar user-avatar tq-own">
                    <div class="avatar" style="width:40px;height:40px;font-size:17px">我</div>
                  </div>
                </div>
                <div class="bubble is-out is-group-first is-group-last">
                  <div class="bubble-content-wrapper">
<div class="bubble-content">
                    <div class="message"><span class="text-content">那就这么定，明天会上同步</span></div>
                    <span class="time">14:23<span class="message-status">✓✓</span></span>
                  </div></div>

                </div>
              </div>
              <div class="bubbles-group">
                <div class="bubbles-group-avatar-container">
                  <div class="bubbles-group-avatar user-avatar">
                    <div class="avatar" style="width:40px;height:40px;font-size:17px">陈</div>
                  </div>
                </div>
                <div class="bubble is-in is-group-first is-group-last">
                  <div class="bubble-content-wrapper">
<div class="bubble-content">
                    <div class="name">陈默</div>
                    <div class="message"><span class="text-content">好，明天上午十点会议室</span></div>
                    <span class="time">14:25</span>
                  </div></div>

                </div>
              </div>
            </div>
          </div>
        </div><div class="chat-input">
          <div class="chat-input-container">
            <div class="rows-wrapper-wrapper">
              <div class="rows-wrapper chat-input-control chat-input-wrapper chat-rows-wrapper">
                <button class="btn-icon chat-input-control-button toggle-emoticons"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" fill="#FFD54F"/><circle cx="8.5" cy="9.5" r="1.4" fill="#5D4037"/><circle cx="15.5" cy="9.5" r="1.4" fill="#5D4037"/><path d="M8 14c1.2 1.6 2.6 2.4 4 2.4s2.8-.8 4-2.4" stroke="#5D4037" stroke-width="1.6" stroke-linecap="round"/></svg></button>
                <div class="input-message-container">
                  <div class="input-message-input" data-inline-placeholder="发送消息"></div>
                </div>
                <button class="btn-icon chat-input-control-button attach-file"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#5A5A5A" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
                <button class="btn-icon btn-primary text-bold chat-input-control-button btn-send"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg></button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- ============ RIGHT sidebar (unused in mobile chat) ============ -->
    <aside id="column-right" class="main-column"></aside>
  </div>
</div>

    <!-- QQ9 message long-press action sheet (static fixture) -->
    <div class="btn-menu contextmenu active">
      <div class="btn-menu-item rp-overflow"><div class="btn-menu-item-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-8.5 8.4 8.9 8.9 0 0 1-3.4-.7L3 20.5l1.3-4.1a8 8 0 0 1-.8-3.4A8.4 8.4 0 0 1 12 4.5a8.4 8.4 0 0 1 9 7z"/></svg></div><div class="btn-menu-item-text">回复</div></div>
      <div class="btn-menu-item rp-overflow"><div class="btn-menu-item-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></div><div class="btn-menu-item-text">复制</div></div>
      <div class="btn-menu-item rp-overflow"><div class="btn-menu-item-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="M16 6l-4-4-4 4"/><path d="M12 2v13"/></svg></div><div class="btn-menu-item-text">转发</div></div>
      <div class="btn-menu-item rp-overflow"><div class="btn-menu-item-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.6-9.2-8.6C1.2 8.6 3 5.5 6.2 5.5c2 0 3.3 1.1 4.2 2.4l1.6 2.1 1.6-2.1c.9-1.3 2.2-2.4 4.2-2.4 3.2 0 5 3.1 3.2 5.9C19 15.4 12 20 12 20z"/></svg></div><div class="btn-menu-item-text">收藏</div></div>
      <div class="btn-menu-item rp-overflow"><div class="btn-menu-item-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/></svg></div><div class="btn-menu-item-text">多选</div></div>
      <div class="btn-menu-item rp-overflow"><div class="btn-menu-item-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 6H5l1.5 14h11z"/><path d="M9 10v6M15 10v6M8 6l1-3h6l1 3"/></svg></div><div class="btn-menu-item-text">删除</div></div>
    </div>
</body>
</html>
